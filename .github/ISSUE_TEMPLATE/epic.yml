name: Epic
description: 跟踪一个跨仓库或跨版本的交付目标
title: "[Epic]: "
labels: ["type/epic"]
body:
  - type: markdown
    attributes:
      value: 请将 Epic 拆为可独立验收的 Issue，并关联目标 release milestone。
  - type: textarea
    id: description
    attributes:
      label: Description
      description: 说明用户价值、背景、范围和明确不做的内容。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: 使用可验证的清单定义完成条件。
      placeholder: "- [ ] 用户可以……"
    validations:
      required: true
  - type: textarea
    id: delivery
    attributes:
      label: Delivery slices and dependencies
      description: 列出子 Issue、依赖仓库、迁移顺序与 release 风险。
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Tests and evidence
      description: 定义单元、集成、端到端、性能或安全验收证据。
    validations:
      required: true
  - type: dropdown
    id: release
    attributes:
      label: Release note category
      options: [Features, Fixes, Security, Migrations, Operations, Documentation]
    validations:
      required: true
