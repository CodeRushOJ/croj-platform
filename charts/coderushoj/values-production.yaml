# Production reference profile. Every workload remains disabled until its
# immutable image digest and external Secret reference are supplied.
backend:
  image:
    requireDigest: true
  storage:
    type: existingClaim
    existingClaim: ""

frontend:
  image:
    requireDigest: true

judgingServer:
  image:
    requireDigest: true

sandbox:
  # Fail closed until the executor supports a writable, delegated cgroup in
  # the selected RuntimeClass without hostPID or a host cgroup mount.
  enabled: false
  image:
    requireDigest: true
  runtimeClassName: kata-qemu
  nodeSelector:
    coderushoj.io/sandbox-worker: "true"
  securityContext:
    privileged: false
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    capabilities:
      drop:
        - ALL
      add: []
    seccompProfile:
      type: RuntimeDefault
  hostCgroup:
    enabled: false
