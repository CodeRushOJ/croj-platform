apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "coderushoj-infra.fullname" . }}-allow-applications-mysql
  labels:
    {{- include "coderushoj-infra.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: mysql
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: coderushoj
              app.kubernetes.io/instance: {{ .Values.applications.instanceLabel }}
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: [backend, judging-server, admin-bootstrap]
      ports:
        - {protocol: TCP, port: 3306}
---
