apiVersion: v1
kind: Service
metadata:
  name: {{ include "coderushoj-infra.fullname" . }}-seaweedfs
  labels:
    {{- include "coderushoj-infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: seaweedfs
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: seaweedfs
  ports:
    - name: s3
      port: 8333
      targetPort: s3
    - name: master
      port: 9333
      targetPort: master
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "coderushoj-infra.fullname" . }}-seaweedfs
  labels:
    {{- include "coderushoj-infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: seaweedfs
spec:
  serviceName: {{ include "coderushoj-infra.fullname" . }}-seaweedfs
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: seaweedfs
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: seaweedfs
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seaweedfs
          image: {{ .Values.seaweedfs.image }}
          imagePullPolicy: IfNotPresent
          command:
            - /usr/bin/weed
            - mini
            - -dir=/data
          securityContext:
            {{- include "coderushoj-infra.securityContext" . | nindent 12 }}
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: s3-access-key
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: s3-secret-key
            - name: S3_BUCKET
              value: {{ .Values.seaweedfs.bucket | quote }}
          ports:
            - name: s3
              containerPort: 8333
            - name: master
              containerPort: 9333
          readinessProbe:
            tcpSocket:
              port: s3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: master
            periodSeconds: 10
          resources:
            {{- toYaml .Values.seaweedfs.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.seaweedfs.storage }}
