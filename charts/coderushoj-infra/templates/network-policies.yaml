apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "coderushoj-infra.fullname" . }}-default-deny
  labels:
    {{- include "coderushoj-infra.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "coderushoj-infra.fullname" . }}-allow-platform
  labels:
    {{- include "coderushoj-infra.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
