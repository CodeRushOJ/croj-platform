apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-judging-internal-egress
spec:
  podSelector:
    matchLabels:
      {{- include "coderushoj.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: judging-server
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "coderushoj.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: backend
      ports:
        - {protocol: TCP, port: 7999}
    - to:
        - podSelector:
            matchLabels:
              {{- include "coderushoj.selectorLabels" . | nindent 14 }}
