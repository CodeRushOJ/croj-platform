apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  parentRefs:
    - name: {{ .Release.Name }}
  hostnames:
    - {{ .Values.gateway.host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: {{ .Values.services.backend.name }}
          port: {{ .Values.services.backend.port }}
    - matches:
        - path:
            type: PathPrefix
            value: /docs
      backendRefs:
        - name: {{ .Values.services.docs.name }}
          port: {{ .Values.services.docs.port }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ .Values.services.frontend.name }}
          port: {{ .Values.services.frontend.port }}
