{{- if .Values.applications.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-default-deny
spec:
  podSelector:
    matchLabels:
      {{- include "coderushoj.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-web-ingress
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [frontend, backend, judging-server, docs]
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-sandbox-ingress
spec:
  podSelector:
    matchLabels:
      {{- include "coderushoj.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: sandbox
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "coderushoj.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: judging-server
      ports:
        - {protocol: TCP, port: 50051}
        - {protocol: TCP, port: 1025}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-backend-internal-ingress
spec:
  podSelector:
    matchLabels:
      {{- include "coderushoj.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "coderushoj.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: judging-server
      ports:
        - {protocol: TCP, port: 7999}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-admin-bootstrap-egress
spec:
  podSelector:
    matchLabels:
      {{- include "coderushoj.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: admin-bootstrap
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: mysql
      ports:
        - {protocol: TCP, port: 3306}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-application-egress
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [backend, judging-server]
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector: {}
      ports:
        - {protocol: TCP, port: 3306}
        - {protocol: TCP, port: 6379}
        - {protocol: TCP, port: 8333}
        - {protocol: TCP, port: 9876}
        - {protocol: TCP, port: 7999}
        - {protocol: TCP, port: 50051}
    # Callback URLs are validated by the judge against SSRF/private-address rules.
    # Production clusters should replace this with an audited egress gateway.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 0.0.0.0/8
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.0.2.0/24
              - 192.168.0.0/16
              - 198.18.0.0/15
              - 198.51.100.0/24
              - 203.0.113.0/24
              - 224.0.0.0/4
              - 240.0.0.0/4
        - ipBlock:
            cidr: ::/0
            except:
              - ::/128
              - ::1/128
              - 100::/64
              - 2001:db8::/32
              - fc00::/7
              - fe80::/10
              - ff00::/8
      ports:
        - {protocol: TCP, port: 443}
{{- end }}
