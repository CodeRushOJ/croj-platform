{{- if .Values.applications.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-backend-uploads
  labels:
    {{- include "coderushoj.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.backend.uploads.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.backend.uploads.storage }}
{{- end }}
