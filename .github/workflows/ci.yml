name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Contracts, docs, manifests, and security
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v4.2.3

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.15.0'

      - name: Install documentation dependencies
        run: |
          corepack enable
          cd docs
          pnpm install --frozen-lockfile

      - name: Run repository validation
        run: make validate

      - name: Build documentation explicitly
        run: cd docs && pnpm build

      - name: Validate rendered Kubernetes resources
        run: |
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0
          kubeconform="$(go env GOPATH)/bin/kubeconform"
          helm template coderushoj-infra charts/coderushoj-infra --namespace coderushoj \
            | "$kubeconform" -strict -summary -ignore-missing-schemas
          helm template coderushoj charts/coderushoj --namespace coderushoj \
            | "$kubeconform" -strict -summary -ignore-missing-schemas
          helm template coderushoj charts/coderushoj --namespace coderushoj \
            --set applications.enabled=true \
            | "$kubeconform" -strict -summary -ignore-missing-schemas
          digest="sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          helm template coderushoj charts/coderushoj --namespace coderushoj \
            --values charts/coderushoj/values-production.yaml \
            --set-string "images.frontend.digest=$digest" \
            --set-string "images.backend.digest=$digest" \
            --set-string "images.judgingServer.digest=$digest" \
            --set-string "images.sandbox.digest=$digest" \
            --set-string "images.docs.digest=$digest" \
            --set backend.smtp.host=smtp.operator.example \
            --set backend.smtp.username=coderushoj@operator.example \
            | "$kubeconform" -strict -summary -ignore-missing-schemas

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.72.0
          cache: true

      - name: Scan source, dependencies, and secrets
        run: |
          trivy fs --scanners secret --exit-code 1 --skip-dirs docs/node_modules .
          trivy fs --db-repository ghcr.io/aquasecurity/trivy-db:2 --no-progress \
            --scanners vuln,misconfig --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 --skip-dirs docs/node_modules .

  test-bundle-contract:
    name: Backend to judging TestBundle v1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out platform repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.3'
          cache: false

      - name: Check out immutable component sources
        run: scripts/checkout-sources.sh

      - name: Verify the real producer-to-consumer contract
        run: scripts/verify-test-bundle-contract.sh

  platform-smoke:
    name: Three-node Kind platform smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install Kind
        run: go install sigs.k8s.io/kind@v0.32.0

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v4.2.3

      - name: Create reference cluster
        run: kind create cluster --name coderushoj --config config/kind/cluster.yaml --wait 240s

      - name: Deploy platform
        run: scripts/deploy.sh

      - name: Run live platform acceptance
        run: tests/smoke/platform.sh

      - name: Collect failure diagnostics
        if: failure()
        run: scripts/diagnostics.sh || true

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: platform-smoke-diagnostics-${{ github.run_id }}
          path: .workspace/diagnostics/
          if-no-files-found: warn
          retention-days: 14

      - name: Delete reference cluster
        if: always()
        run: kind delete cluster --name coderushoj

  platform-product-e2e:
    name: Real three-node Kind product E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Check out platform repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v4.2.3

      - name: Install Kind
        run: go install sigs.k8s.io/kind@v0.32.0

      - name: Name the owned disposable cluster
        run: |
          cluster_name="croj-product-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "CROJ_E2E_CLUSTER_NAME=$cluster_name" >> "$GITHUB_ENV"
          echo "CODERUSHOJ_CLUSTER_NAME=$cluster_name" >> "$GITHUB_ENV"

      - name: Check out immutable component sources
        run: scripts/checkout-sources.sh

      - name: Build locked components and current-checkout Docs
        run: scripts/build-dev-images.sh

      - name: Create the owned three-node Kind cluster
        run: |
          kind create cluster \
            --name "$CROJ_E2E_CLUSTER_NAME" \
            --config config/kind/product-e2e.yaml

      - name: Install policy-capable cluster networking
        run: scripts/install-kind-networking.sh

      - name: Load verified application images
        run: scripts/load-dev-images.sh --cluster "$CROJ_E2E_CLUSTER_NAME"

      - name: Load the pinned NetworkPolicy probe
        run: |
          source config/versions.env
          docker pull "$E2E_NETWORK_PROBE_IMAGE"
          kind load docker-image "$E2E_NETWORK_PROBE_IMAGE" \
            --name "$CROJ_E2E_CLUSTER_NAME"

      - name: Deploy dependencies, applications, and operator bootstrap
        run: scripts/deploy-product-e2e.sh

      - name: Run the real HTTP product and external judge loop
        run: tests/e2e/product.sh

      - name: Verify enforced NetworkPolicy isolation
        run: tests/e2e/network-policy.sh

      - name: Collect redacted product E2E diagnostics
        if: failure()
        run: scripts/diagnostics.sh || true

      - name: Upload redacted product E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: product-e2e-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: .workspace/diagnostics/
          if-no-files-found: warn
          retention-days: 14

      - name: Delete owned product E2E cluster
        if: always()
        run: scripts/cleanup-product-e2e.sh "$CROJ_E2E_CLUSTER_NAME"
