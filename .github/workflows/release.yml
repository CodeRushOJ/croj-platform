name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  actions: read
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCS_IMAGE: ghcr.io/coderushoj/coderushoj-docs

jobs:
  release:
    name: Verify and publish immutable v1 artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out annotated release tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version: '24.15.0'

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.0.0
        with:
          go-version: '1.26.5'
          cache: false

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v4.2.3

      - name: Verify version, annotated tag, latest main, charts, and changelog
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$GITHUB_REF_NAME" = "v$version"
          git rev-parse "$GITHUB_REF_NAME^{tag}" >/dev/null
          test "$(git rev-parse "$GITHUB_REF_NAME^{commit}")" = "$GITHUB_SHA"
          git fetch --no-tags origin main
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)"
          test "$(helm show chart charts/coderushoj | awk '/^version:/ {print $2}')" = "$version"
          test "$(helm show chart charts/coderushoj-infra | awk '/^version:/ {print $2}')" = "$version"
          grep -Fq "## [$version]" CHANGELOG.md
          release_section_file="$(mktemp)"
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { capture=1 }
            capture && $0 ~ /^## \[/ && $0 !~ "^## \\[" version "\\]" { exit }
            capture { print }
          ' CHANGELOG.md > "$release_section_file"
          for heading in Features Fixes Security Migrations Operations "Known Limitations" Upgrade Rollback; do
            grep -Fq "### $heading" "$release_section_file"
          done

      - name: Verify source lock before release state detection
        run: scripts/verify-source-lock.py validate

      - name: Detect existing release
        id: release-presence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          existing_release_json="$RUNNER_TEMP/existing-release.json"
          existing_asset_directory="$RUNNER_TEMP/existing-release-assets"
          existing_release_error="$(mktemp)"
          if gh api \
            --method GET \
            "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" \
            >"$existing_release_json" \
            2>"$existing_release_error"
          then
            mkdir -p "$existing_asset_directory"
            gh release download "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --dir "$existing_asset_directory"
            release_present="true"
          elif grep -Fq "HTTP 404" "$existing_release_error"; then
            release_present="false"
          else
            cat "$existing_release_error" >&2
            exit 1
          fi
          printf 'present=%s\n' "$release_present" >> "$GITHUB_OUTPUT"

      - name: Verify successful main CI and real product E2E
        if: steps.release-presence.outputs.present == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/verify-main-ci.py \
            --repository "$GITHUB_REPOSITORY" \
            --workflow ci.yml \
            --revision "$GITHUB_SHA" \
            --branch main \
            --required-job "Real three-node Kind product E2E" \
            --timeout-seconds 5400 \
            --poll-interval-seconds 20

      - name: Enable the pinned pnpm package manager
        if: steps.release-presence.outputs.present == 'false'
        run: corepack enable

      - name: Install locked documentation dependencies
        if: steps.release-presence.outputs.present == 'false'
        working-directory: docs
        run: pnpm install --frozen-lockfile

      - name: Run the complete static release gate
        if: steps.release-presence.outputs.present == 'false'
        run: make validate

      - name: Build documentation
        if: steps.release-presence.outputs.present == 'false'
        working-directory: docs
        run: pnpm build

      - name: Package Helm charts and release notes
        if: steps.release-presence.outputs.present == 'false'
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          mkdir -p dist
          helm lint charts/coderushoj
          helm lint charts/coderushoj-infra
          helm package charts/coderushoj --destination dist
          helm package charts/coderushoj-infra --destination dist
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { capture=1 }
            capture && $0 ~ /^## \[/ && $0 !~ "^## \\[" version "\\]" { exit }
            capture { print }
          ' CHANGELOG.md > dist/release-notes.md
          test -s dist/release-notes.md

      - name: Download the four public component release manifests
        shell: bash
        run: |
          set -euo pipefail

          download_manifest() {
            local url="$1"
            local destination="$2"
            local expected_sha256="$3"
            mkdir -p "$(dirname "$destination")"
            curl \
              --proto '=https' \
              --tlsv1.2 \
              --fail \
              --silent \
              --show-error \
              --location \
              --retry 3 \
              --retry-all-errors \
              --output "$destination" \
              "$url"
            test -s "$destination"
            printf '%s  %s\n' "$expected_sha256" "$destination" | sha256sum --check --status
          }

          frontend_release_tag="$(jq -er '.sources.frontend.releaseTag' config/source-lock.json)"
          frontend_release_manifest_asset="$(jq -er '.sources.frontend.releaseManifestAsset' config/source-lock.json)"
          frontend_release_manifest_sha256="$(jq -er '.sources.frontend.releaseManifestSha256' config/source-lock.json)"
          backend_release_tag="$(jq -er '.sources.backend.releaseTag' config/source-lock.json)"
          backend_release_manifest_asset="$(jq -er '.sources.backend.releaseManifestAsset' config/source-lock.json)"
          backend_release_manifest_sha256="$(jq -er '.sources.backend.releaseManifestSha256' config/source-lock.json)"
          judging_release_tag="$(jq -er '.sources["judging-server"].releaseTag' config/source-lock.json)"
          judging_release_manifest_asset="$(jq -er '.sources["judging-server"].releaseManifestAsset' config/source-lock.json)"
          judging_release_manifest_sha256="$(jq -er '.sources["judging-server"].releaseManifestSha256' config/source-lock.json)"
          sandbox_release_tag="$(jq -er '.sources.sandbox.releaseTag' config/source-lock.json)"
          sandbox_release_manifest_asset="$(jq -er '.sources.sandbox.releaseManifestAsset' config/source-lock.json)"
          sandbox_release_manifest_sha256="$(jq -er '.sources.sandbox.releaseManifestSha256' config/source-lock.json)"

          download_manifest \
            "https://github.com/CodeRushOJ/croj-frontend/releases/download/$frontend_release_tag/$frontend_release_manifest_asset" \
            "dist/component-images/frontend/$frontend_release_manifest_asset" \
            "$frontend_release_manifest_sha256"
          download_manifest \
            "https://github.com/CodeRushOJ/croj-backend/releases/download/$backend_release_tag/$backend_release_manifest_asset" \
            "dist/component-images/backend/$backend_release_manifest_asset" \
            "$backend_release_manifest_sha256"
          download_manifest \
            "https://github.com/CodeRushOJ/croj-judging-server/releases/download/$judging_release_tag/$judging_release_manifest_asset" \
            "dist/component-images/judging-server/$judging_release_manifest_asset" \
            "$judging_release_manifest_sha256"
          download_manifest \
            "https://github.com/CodeRushOJ/croj-sandbox/releases/download/$sandbox_release_tag/$sandbox_release_manifest_asset" \
            "dist/component-images/sandbox/$sandbox_release_manifest_asset" \
            "$sandbox_release_manifest_sha256"

      - name: Verify downloaded release manifest checksums
        shell: bash
        run: |
          set -euo pipefail
          for component in frontend backend judging-server sandbox; do
            asset="$(jq -er --arg component "$component" '.sources[$component].releaseManifestAsset' config/source-lock.json)"
            expected_sha256="$(jq -er --arg component "$component" '.sources[$component].releaseManifestSha256' config/source-lock.json)"
            destination="dist/component-images/$component/$asset"
            printf '%s  %s\n' "$expected_sha256" "$destination" | sha256sum --check --status
          done

      - name: Validate immutable component inputs before publication
        shell: bash
        run: |
          set -euo pipefail
          scripts/build-production-image-manifest.py \
            --components-only \
            --version "$(tr -d '\r\n' < VERSION)" \
            --source-lock config/source-lock.json \
            --platform-revision "$GITHUB_SHA" \
            --manifest frontend=dist/component-images/frontend/image-artifact.json \
            --manifest backend=dist/component-images/backend/backend-image.json \
            --manifest judging-server=dist/component-images/judging-server/judging-server-image.json \
            --manifest sandbox=dist/component-images/sandbox/sandbox-image.json \
            --output-directory dist/preflight

      - name: Detect and verify existing release
        id: release-state
        env:
          RELEASE_PRESENT: ${{ steps.release-presence.outputs.present }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_PRESENT" == "true" ]]; then
            existing_asset_directory="$RUNNER_TEMP/existing-release-assets"
            verification="$(
              python3 scripts/verify-release-assets.py \
                --release-json "$RUNNER_TEMP/existing-release.json" \
                --asset-directory "$existing_asset_directory" \
                --version-file VERSION \
                --source-lock config/source-lock.json \
                --component-preflight dist/preflight/component-images.json \
                --platform-revision "$GITHUB_SHA" \
                --changelog CHANGELOG.md \
                --application-chart charts/coderushoj \
                --infrastructure-chart charts/coderushoj-infra
            )"
            release_state="$(jq -er '.state' <<<"$verification")"
            recovered_docs_digest="$(jq -er '.docsDigest' <<<"$verification")"
            cp "$existing_asset_directory"/* dist/
          elif [[ "$RELEASE_PRESENT" == "false" ]]; then
            release_state="fresh"
            recovered_docs_digest=""
          else
            echo "invalid existing release presence state: $RELEASE_PRESENT" >&2
            exit 1
          fi
          printf 'state=%s\n' "$release_state" >> "$GITHUB_OUTPUT"
          printf 'docs-digest=%s\n' "$recovered_docs_digest" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU for cross-architecture builds
        if: steps.release-state.outputs.state == 'fresh'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.11.1

      - name: Verify component registry indexes before publication
        shell: bash
        run: |
          set -euo pipefail
          for component in frontend backend judging-server sandbox; do
            repository="$(jq -er --arg component "$component" '.images[$component].repository' dist/preflight/component-images.json)"
            digest="$(jq -er --arg component "$component" '.images[$component].digest' dist/preflight/component-images.json)"
            docker buildx imagetools inspect --raw "$repository@$digest" |
              jq -e '
                [.manifests[] |
                  select(.platform.os != "unknown") |
                  (.platform.os + "/" + .platform.architecture)] |
                sort == ["linux/amd64", "linux/arm64"]
              ' >/dev/null
          done

      - name: Log in to GHCR
        if: steps.release-state.outputs.state != 'published'
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish staged multi-architecture documentation image
        if: steps.release-state.outputs.state == 'fresh'
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.18.0
        with:
          context: docs
          file: docs/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.DOCS_IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest documentation image with GitHub OIDC
        if: steps.release-state.outputs.state == 'fresh'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.0
        with:
          subject-name: ${{ env.DOCS_IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Record documentation image manifest
        if: steps.release-state.outputs.state == 'fresh'
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg repository "$DOCS_IMAGE" \
            --arg tag "$GITHUB_REF_NAME" \
            --arg revision "$GITHUB_SHA" \
            --arg digest "$IMAGE_DIGEST" \
            --argjson platforms '["linux/amd64","linux/arm64"]' \
            '{repository:$repository,tag:$tag,revision:$revision,digest:$digest,platforms:$platforms}' \
            > dist/docs-image.json

      - name: Validate and assemble digest-only production image values
        if: steps.release-state.outputs.state == 'fresh'
        shell: bash
        run: |
          set -euo pipefail
          scripts/build-production-image-manifest.py \
            --version "$(tr -d '\r\n' < VERSION)" \
            --source-lock config/source-lock.json \
            --platform-revision "$GITHUB_SHA" \
            --manifest frontend=dist/component-images/frontend/image-artifact.json \
            --manifest backend=dist/component-images/backend/backend-image.json \
            --manifest judging-server=dist/component-images/judging-server/judging-server-image.json \
            --manifest sandbox=dist/component-images/sandbox/sandbox-image.json \
            --manifest docs=dist/docs-image.json \
            --output-directory dist

      - name: Verify registry indexes contain exactly amd64 and arm64 images
        shell: bash
        run: |
          set -euo pipefail
          for component in frontend backend judging-server sandbox docs; do
            repository="$(jq -er --arg component "$component" '.images[$component].repository' dist/production-images.json)"
            digest="$(jq -er --arg component "$component" '.images[$component].digest' dist/production-images.json)"
            docker buildx imagetools inspect --raw "$repository@$digest" |
              jq -e '
                [.manifests[] |
                  select(.platform.os != "unknown") |
                  (.platform.os + "/" + .platform.architecture)] |
                sort == ["linux/amd64", "linux/arm64"]
              ' >/dev/null
          done

      - name: Render and validate digest-only production deployment
        if: steps.release-state.outputs.state == 'fresh'
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0
          helm template coderushoj charts/coderushoj \
            --namespace coderushoj \
            --values charts/coderushoj/values-production.yaml \
            --values dist/production-images.yaml \
            --set backend.smtp.host=smtp.operator.example \
            --set backend.smtp.username=coderushoj@operator.example \
            > dist/production-render.yaml
          "$(go env GOPATH)/bin/kubeconform" \
            -strict -summary -ignore-missing-schemas \
            dist/production-render.yaml

      - name: Generate artifact checksums
        if: steps.release-state.outputs.state == 'fresh'
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          checksums="$(mktemp)"
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 |
            sort -z |
            xargs -0 sha256sum > "$checksums"
          mv "$checksums" SHA256SUMS
          test -s SHA256SUMS

      - name: Create verified draft GitHub Release
        if: steps.release-state.outputs.state == 'fresh'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            dist/*.tgz \
            dist/SHA256SUMS \
            dist/release-notes.md \
            dist/docs-image.json \
            dist/production-images.json \
            dist/production-images.yaml \
            dist/production-render.yaml \
            --draft \
            --verify-tag \
            --title "CodeRushOJ $GITHUB_REF_NAME" \
            --notes-file dist/release-notes.md
          gh api \
            --method GET \
            "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" \
            > "$RUNNER_TEMP/created-draft-release.json"
          mkdir -p "$RUNNER_TEMP/created-release-assets"
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/created-release-assets"
          python3 scripts/verify-release-assets.py \
            --release-json "$RUNNER_TEMP/created-draft-release.json" \
            --asset-directory "$RUNNER_TEMP/created-release-assets" \
            --version-file VERSION \
            --source-lock config/source-lock.json \
            --component-preflight dist/preflight/component-images.json \
            --platform-revision "$GITHUB_SHA" \
            --changelog CHANGELOG.md \
            --application-chart charts/coderushoj \
            --infrastructure-chart charts/coderushoj-infra |
            jq -e '.state == "draft"' >/dev/null

      - name: Publish verified documentation version tag
        env:
          FRESH_DOCS_DIGEST: ${{ steps.push.outputs.digest }}
          RECOVERED_DOCS_DIGEST: ${{ steps.release-state.outputs.docs-digest }}
          RELEASE_STATE: ${{ steps.release-state.outputs.state }}
        shell: bash
        run: |
          set -euo pipefail
          case "$RELEASE_STATE" in
            fresh)
              docs_digest="$FRESH_DOCS_DIGEST"
              ;;
            draft|published)
              docs_digest="$RECOVERED_DOCS_DIGEST"
              ;;
            *)
              echo "unknown release state: $RELEASE_STATE" >&2
              exit 1
              ;;
          esac
          [[ "$docs_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          docs_inspect_error="$(mktemp)"
          if docs_inspect="$(
            docker buildx imagetools inspect "$DOCS_IMAGE:$GITHUB_REF_NAME" \
              2>"$docs_inspect_error"
          )"; then
            existing_docs_digest="$(
              awk '$1 == "Digest:" {print $2; exit}' <<<"$docs_inspect"
            )"
            test -n "$existing_docs_digest"
            if [[ "$existing_docs_digest" != "$docs_digest" ]]; then
              echo "refusing to overwrite documentation version tag: expected $docs_digest, found $existing_docs_digest" >&2
              exit 1
            fi
            echo "documentation version tag already has verified digest $docs_digest"
          elif [[ "$RELEASE_STATE" == "published" ]]; then
            cat "$docs_inspect_error" >&2
            echo "published release is missing its documentation version tag" >&2
            exit 1
          elif grep -Eiq 'manifest unknown|not found' "$docs_inspect_error"; then
            docker buildx imagetools create \
              --tag "$DOCS_IMAGE:$GITHUB_REF_NAME" \
              "$DOCS_IMAGE@$docs_digest"
          else
            cat "$docs_inspect_error" >&2
            exit 1
          fi
          published_digest="$(
            docker buildx imagetools inspect "$DOCS_IMAGE:$GITHUB_REF_NAME" |
              awk '$1 == "Digest:" {print $2; exit}'
          )"
          test "$published_digest" = "$docs_digest"

      - name: Publish verified GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_STATE: ${{ steps.release-state.outputs.state }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_STATE" == "published" ]]; then
            echo "exact immutable GitHub Release is already published"
            exit 0
          fi
          case "$RELEASE_STATE" in
            fresh)
              release_asset_directory="$RUNNER_TEMP/created-release-assets"
              ;;
            draft)
              release_asset_directory="$RUNNER_TEMP/existing-release-assets"
              ;;
            *)
              echo "unknown release state: $RELEASE_STATE" >&2
              exit 1
              ;;
          esac
          gh release edit "$GITHUB_REF_NAME" --draft=false
          gh api \
            --method GET \
            "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" \
            > "$RUNNER_TEMP/published-release.json"
          python3 scripts/verify-release-assets.py \
            --release-json "$RUNNER_TEMP/published-release.json" \
            --asset-directory "$release_asset_directory" \
            --version-file VERSION \
            --source-lock config/source-lock.json \
            --component-preflight dist/preflight/component-images.json \
            --platform-revision "$GITHUB_SHA" \
            --changelog CHANGELOG.md \
            --application-chart charts/coderushoj \
            --infrastructure-chart charts/coderushoj-infra |
            jq -e '.state == "published"' >/dev/null
