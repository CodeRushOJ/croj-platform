---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-backend-smtp-egress
spec:
  podSelector:
    matchLabels:
      {{- include "coderushoj.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  policyTypes: [Egress]
  egress:
    {{- if eq .Values.deploymentProfile "production" }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
        - ipBlock:
            cidr: ::/0
      ports:
        - {protocol: TCP, port: {{ .Values.backend.smtp.port }}}
    {{- else }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Values.dependencies.instanceLabel }}
              app.kubernetes.io/component: mailpit
      ports:
        - {protocol: TCP, port: {{ .Values.backend.smtp.port }}}
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-judging-webhook-egress
spec:
  podSelector:
    matchLabels:
      {{- include "coderushoj.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: judging-server
  policyTypes: [Egress]
  egress:
    # Callback URLs are also validated by the judge against SSRF,
    # DNS-rebinding, private-address, and redirect rules.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 0.0.0.0/8
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.0.2.0/24
              - 192.168.0.0/16
              - 198.18.0.0/15
              - 198.51.100.0/24
              - 203.0.113.0/24
              - 224.0.0.0/4
              - 240.0.0.0/4
        - ipBlock:
            cidr: ::/0
            except:
              - ::/128
              - ::1/128
              - 100::/64
              - 2001:db8::/32
              - fc00::/7
              - fe80::/10
              - ff00::/8
      ports:
        - {protocol: TCP, port: 443}
{{- end }}
