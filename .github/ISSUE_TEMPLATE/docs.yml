name: Documentation
description: 改进用户、开发或运维文档
title: "[Docs]: "
labels: ["type/docs"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description and audience
      description: 说明目标读者、缺失或不准确的内容及其影响。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: 列出页面、示例、链接和可读性验收条件。
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Tests and review evidence
      description: 说明文档构建、命令验证、截图或技术审阅方式。
    validations:
      required: true
  - type: dropdown
    id: release
    attributes:
      label: Release note category
      options: [Documentation, Operations, Migrations]
    validations:
      required: true
