apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "coderushoj-infra.fullname" . }}-rocketmq-broker
  labels:
    {{- include "coderushoj-infra.labels" . | nindent 4 }}
data:
  broker.conf: |
    {{- include "coderushoj-infra.rocketmqBrokerConfig" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "coderushoj-infra.fullname" . }}-rocketmq-namesrv
  labels:
    {{- include "coderushoj-infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: rocketmq-namesrv
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: rocketmq-namesrv
  ports:
    - name: namesrv
      port: 9876
      targetPort: namesrv
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "coderushoj-infra.fullname" . }}-rocketmq-namesrv
  labels:
    {{- include "coderushoj-infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: rocketmq-namesrv
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: rocketmq-namesrv
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: rocketmq-namesrv
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 3000
        runAsGroup: 3000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: namesrv
          image: {{ .Values.rocketmq.image }}
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - mqnamesrv
          securityContext:
            {{- include "coderushoj-infra.securityContext" . | nindent 12 }}
          env:
            - name: HEAP_OPTS
              value: -Xms256m -Xmx256m -Xmn128m
          ports:
            - name: namesrv
              containerPort: 9876
          readinessProbe:
            tcpSocket:
              port: namesrv
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: namesrv
            periodSeconds: 10
          resources:
            {{- toYaml .Values.rocketmq.nameserverResources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "coderushoj-infra.fullname" . }}-rocketmq-broker
  labels:
    {{- include "coderushoj-infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: rocketmq-broker
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: rocketmq-broker
  ports:
    - name: broker
      port: 10911
      targetPort: broker
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "coderushoj-infra.fullname" . }}-rocketmq-broker
  labels:
    {{- include "coderushoj-infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: rocketmq-broker
spec:
  serviceName: {{ include "coderushoj-infra.fullname" . }}-rocketmq-broker
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: rocketmq-broker
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: rocketmq-broker
      annotations:
        checksum/broker-config: {{ include "coderushoj-infra.rocketmqBrokerConfig" . | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 3000
        runAsGroup: 3000
        fsGroup: 3000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: broker
          image: {{ .Values.rocketmq.image }}
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - mqbroker
            - -n
            - {{ include "coderushoj-infra.fullname" . }}-rocketmq-namesrv:9876
            - -c
            - /etc/rocketmq/broker.conf
          securityContext:
            {{- include "coderushoj-infra.securityContext" . | nindent 12 }}
          env:
            - name: HEAP_OPTS
              value: -Xms512m -Xmx512m -Xmn256m -XX:MaxDirectMemorySize=256m
          ports:
            - name: broker
              containerPort: 10911
          readinessProbe:
            tcpSocket:
              port: broker
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: broker
            periodSeconds: 10
          resources:
            {{- toYaml .Values.rocketmq.brokerResources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/rocketmq
              readOnly: true
            - name: data
              mountPath: /home/rocketmq/store
      volumes:
        - name: config
          configMap:
            name: {{ include "coderushoj-infra.fullname" . }}-rocketmq-broker
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.rocketmq.storage }}
