apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "coderushoj-infra.fullname" . }}-default-deny
  labels:
    {{- include "coderushoj-infra.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "coderushoj-infra.fullname" . }}-allow-infra-internal
  labels:
    {{- include "coderushoj-infra.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [mysql, redis, rocketmq-namesrv, rocketmq-broker, rocketmq-topic-bootstrap, seaweedfs]
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: [mysql, redis, rocketmq-namesrv, rocketmq-broker, rocketmq-topic-bootstrap, seaweedfs]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: [mysql, redis, rocketmq-namesrv, rocketmq-broker, rocketmq-topic-bootstrap, seaweedfs]
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "coderushoj-infra.fullname" . }}-allow-s3-smoke-egress
  labels:
    {{- include "coderushoj-infra.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: s3-smoke
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: seaweedfs
      ports:
        - {protocol: TCP, port: 8333}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "coderushoj-infra.fullname" . }}-allow-s3-smoke-ingress
  labels:
    {{- include "coderushoj-infra.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: seaweedfs
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: s3-smoke
      ports:
        - {protocol: TCP, port: 8333}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "coderushoj-infra.fullname" . }}-allow-applications
  labels:
    {{- include "coderushoj-infra.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Values.applications.instanceLabel }}
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: [backend, judging-server]
      ports:
        - {protocol: TCP, port: 3306}
        - {protocol: TCP, port: 6379}
        - {protocol: TCP, port: 8333}
        - {protocol: TCP, port: 9876}
        - {protocol: TCP, port: 10911}
        - {protocol: TCP, port: 1025}
