{{- if .Values.mailpit.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "coderushoj-infra.fullname" . }}-allow-mailpit-replies
  labels:
    {{- include "coderushoj-infra.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: mailpit
  policyTypes:
    - Egress
  egress:
    - to:
        {{- range .Values.mailpit.replyCIDRs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "coderushoj-infra.fullname" . }}-allow-applications-mailpit
  labels:
    {{- include "coderushoj-infra.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: mailpit
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: coderushoj
              app.kubernetes.io/instance: {{ .Values.applications.instanceLabel }}
              app.kubernetes.io/component: backend
      ports:
        - {protocol: TCP, port: 1025}
{{- end }}
