{{- if .Values.backend.enabled }}
{{- if empty .Values.backend.existingSecret.name }}
{{- fail "backend.existingSecret.name is required when backend.enabled=true" }}
{{- end }}
{{- if and (eq .Values.backend.storage.type "existingClaim") (empty .Values.backend.storage.existingClaim) }}
{{- fail "backend.storage.existingClaim is required when backend.storage.type=existingClaim" }}
{{- end }}
{{- $name := .Values.backend.service.name }}
{{- $labels := dict "name" $name "root" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "coderushoj.selectorLabels" $labels | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "coderushoj.selectorLabels" $labels | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "coderushoj.selectorLabels" $labels | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      {{- include "coderushoj.selectorLabels" $labels | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "coderushoj.selectorLabels" $labels | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.backend.terminationGracePeriodSeconds }}
      {{- with .Values.backend.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.backend.topologySpread.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.backend.topologySpread.maxSkew }}
          topologyKey: {{ .Values.backend.topologySpread.topologyKey }}
          whenUnsatisfiable: {{ .Values.backend.topologySpread.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "coderushoj.selectorLabels" $labels | nindent 14 }}
      {{- end }}
      {{- if .Values.backend.antiAffinity.enabled }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: {{ .Values.backend.antiAffinity.topologyKey }}
                labelSelector:
                  matchLabels:
                    {{- include "coderushoj.selectorLabels" $labels | nindent 20 }}
      {{- end }}
      containers:
        - name: backend
          image: {{ include "coderushoj.image" (dict "name" "backend" "image" .Values.backend.image) | quote }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.service.containerPort }}
              protocol: TCP
          env:
            - name: DATABASE_URL
              value: {{ .Values.backend.config.databaseUrl | quote }}
            - name: REDIS_HOST
              value: {{ .Values.backend.config.redisHost | quote }}
            - name: REDIS_PORT
              value: {{ .Values.backend.config.redisPort | quote }}
            - name: ROCKETMQ_NAME_SERVER
              value: {{ .Values.backend.config.rocketmqNameServer | quote }}
            - name: SUBMISSION_TOPIC
              value: {{ .Values.backend.config.submissionTopic | quote }}
            - name: SMTP_HOST
              value: {{ .Values.backend.config.smtpHost | quote }}
            - name: SMTP_PORT
              value: {{ .Values.backend.config.smtpPort | quote }}
            - name: CORS_ALLOWED_ORIGINS
              value: {{ .Values.backend.config.corsAllowedOrigins | quote }}
            - name: FILE_UPLOAD_DIR
              value: {{ .Values.backend.storage.mountPath | quote }}
            {{- $secretName := .Values.backend.existingSecret.name }}
            {{- $secretKeys := .Values.backend.existingSecret.keys }}
            {{- range $envName, $key := dict
              "DATABASE_USERNAME" $secretKeys.databaseUsername
              "DATABASE_PASSWORD" $secretKeys.databasePassword
              "REDIS_PASSWORD" $secretKeys.redisPassword
              "ROCKETMQ_ACCESS_KEY" $secretKeys.rocketmqAccessKey
              "ROCKETMQ_SECRET_KEY" $secretKeys.rocketmqSecretKey
              "JWT_SECRET" $secretKeys.jwtSecret
              "SMTP_USERNAME" $secretKeys.smtpUsername
              "SMTP_PASSWORD" $secretKeys.smtpPassword
              "JUDGE_RESULT_SERVICE_TOKEN" $secretKeys.judgeResultServiceToken }}
            - name: {{ $envName }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ $key }}
            {{- end }}
          startupProbe:
            httpGet:
              path: {{ .Values.backend.probes.startup.path }}
              port: http
            failureThreshold: {{ .Values.backend.probes.startup.failureThreshold }}
            periodSeconds: {{ .Values.backend.probes.startup.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.backend.probes.readiness.path }}
              port: http
            failureThreshold: {{ .Values.backend.probes.readiness.failureThreshold }}
            periodSeconds: {{ .Values.backend.probes.readiness.periodSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.backend.probes.liveness.path }}
              port: http
            failureThreshold: {{ .Values.backend.probes.liveness.failureThreshold }}
            periodSeconds: {{ .Values.backend.probes.liveness.periodSeconds }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.backend.securityContext | nindent 12 }}
          volumeMounts:
            - name: backend-tmp
              mountPath: /tmp
            - name: backend-uploads
              mountPath: {{ .Values.backend.storage.mountPath }}
      volumes:
        - name: backend-tmp
          emptyDir: {}
        - name: backend-uploads
          {{- if eq .Values.backend.storage.type "existingClaim" }}
          persistentVolumeClaim:
            claimName: {{ .Values.backend.storage.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- if .Values.backend.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  labels:
    {{- include "coderushoj.selectorLabels" $labels | nindent 4 }}
spec:
  minAvailable: {{ .Values.backend.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "coderushoj.selectorLabels" $labels | nindent 6 }}
{{- end }}
{{- end }}
