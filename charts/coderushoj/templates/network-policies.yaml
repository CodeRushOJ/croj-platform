{{- if .Values.applications.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-default-deny
spec:
  podSelector:
    matchLabels:
      {{- include "coderushoj.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-web-ingress
spec:
  podSelector:
    matchLabels:
      {{- include "coderushoj.selectorLabels" . | nindent 6 }}
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [frontend, backend, judging-server, docs]
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-sandbox-ingress
spec:
  podSelector:
    matchLabels:
      {{- include "coderushoj.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: sandbox
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "coderushoj.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: judging-server
      ports:
        - {protocol: TCP, port: 50051}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-backend-internal-ingress
spec:
  podSelector:
    matchLabels:
      {{- include "coderushoj.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "coderushoj.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: judging-server
      ports:
        - {protocol: TCP, port: 7999}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-dns-egress
spec:
  podSelector:
    matchLabels:
      {{- include "coderushoj.selectorLabels" . | nindent 6 }}
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [backend, judging-server]
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-backend-dependencies-egress
spec:
  podSelector:
    matchLabels:
      {{- include "coderushoj.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Values.dependencies.instanceLabel }}
              app.kubernetes.io/component: mysql
      ports:
        - {protocol: TCP, port: 3306}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Values.dependencies.instanceLabel }}
              app.kubernetes.io/component: redis
      ports:
        - {protocol: TCP, port: 6379}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Values.dependencies.instanceLabel }}
              app.kubernetes.io/component: seaweedfs
      ports:
        - {protocol: TCP, port: 8333}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Values.dependencies.instanceLabel }}
              app.kubernetes.io/component: rocketmq-namesrv
      ports:
        - {protocol: TCP, port: 9876}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Values.dependencies.instanceLabel }}
              app.kubernetes.io/component: rocketmq-broker
      ports:
        - {protocol: TCP, port: 10911}
---
